<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="supported-field-types" content="单行文本 多行文本 图片上传 文件上传 视频上传 日期时间 单选 多选">
  <title>提交成果 - 连续劳务平台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 980px; background: #f5f7fb; color: #26364d; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .topbar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid #e2e8f1; }
    .topbar h1 { margin: 0; font-size: 17px; color: #1f2f46; }
    .close { border: 0; background: transparent; color: #748196; font-size: 24px; cursor: pointer; }
    .page { width: 900px; margin: 22px auto 104px; }
    .card { margin-bottom: 16px; padding: 22px 24px; background: #fff; border: 1px solid #e0e7f0; border-radius: 6px; }
    .card-title { margin: 0 0 18px; color: #24354c; font-size: 16px; }
    .task-name { margin-bottom: 13px; color: #182a43; font-size: 18px; font-weight: 700; }
    .task-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 44px; color: #627086; }
    .task-grid span { color: #8b97a8; }
    .tip { margin: -2px 0 20px; padding: 10px 12px; border: 1px solid #d8e8fb; border-radius: 4px; background: #f5faff; color: #54708f; line-height: 1.65; }
    .submit-field { padding: 16px 0; border-top: 1px solid #edf1f6; }
    .submit-field:first-of-type { border-top: 0; }
    .field-label { display: block; margin-bottom: 8px; color: #34445b; font-weight: 600; }
    .required::before { content: "*"; margin-right: 4px; color: #f5222d; }
    .field-control { max-width: 620px; }
    input, textarea { width: 100%; border: 1px solid #cfd9e6; border-radius: 4px; color: #26364d; background: #fff; font: inherit; outline: none; }
    input { height: 36px; padding: 0 11px; }
    textarea { min-height: 112px; padding: 10px 11px; resize: vertical; line-height: 1.6; }
    input:focus, textarea:focus { border-color: #2f80ed; box-shadow: 0 0 0 2px rgba(47,128,237,.12); }
    .quantity-row { display: flex; align-items: center; gap: 10px; max-width: 620px; }
    .quantity-row input { width: 540px; }
    .field-help, .upload-help { margin-top: 7px; color: #8491a4; font-size: 12px; line-height: 1.55; }
    .counter { margin-top: 5px; color: #98a4b4; text-align: right; font-size: 12px; }
    .choice-group { display: flex; flex-wrap: wrap; gap: 10px 18px; }
    .choice-option { display: inline-flex; align-items: center; gap: 6px; color: #435269; cursor: pointer; }
    .choice-option input { width: auto; height: auto; accent-color: #2f80ed; }
    .upload-shell { padding: 12px; border: 1px dashed #bfd1e7; border-radius: 5px; background: #fbfdff; }
    .upload-button { display: inline-flex; align-items: center; height: 32px; padding: 0 13px; border-radius: 4px; background: #2f80ed; color: #fff; cursor: pointer; font-size: 13px; }
    .upload-button input { display: none; }
    .file-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .file-name { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 5px 8px; border-radius: 3px; background: #edf5ff; color: #3c6f9f; font-size: 12px; }
    .file-name button { border: 0; background: transparent; color: #6b7f97; cursor: pointer; font-size: 15px; line-height: 1; }
    .footer { position: fixed; right: 0; bottom: 0; left: 0; display: flex; justify-content: flex-end; gap: 12px; padding: 14px 30px; border-top: 1px solid #e2e8f1; background: rgba(255,255,255,.97); }
    .btn { height: 36px; min-width: 82px; padding: 0 16px; border: 1px solid #cfd9e6; border-radius: 4px; background: #fff; color: #49576c; cursor: pointer; font: inherit; }
    .btn.primary { border-color: #2f80ed; background: #2f80ed; color: #fff; }
    .toast { position: fixed; bottom: 76px; left: 50%; z-index: 10; padding: 10px 16px; border-radius: 4px; background: rgba(31,45,65,.94); color: #fff; opacity: 0; transform: translate(-50%, 8px); transition: .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <header class="topbar"><h1>提交成果</h1><button class="close" id="cancelBtn" aria-label="关闭">x</button></header>
  <main class="page">
    <section class="card"><h2 class="card-title">任务信息</h2><div class="task-name" id="taskName"></div><div class="task-grid"><div><span>任务编号：</span><b id="taskNumber"></b></div><div><span>客户名称：</span><b id="taskCustomer"></b></div><div><span>结算方式：</span><b id="settlementMethod"></b></div><div><span>单价：</span><b id="unitPrice"></b></div></div></section>
    <section class="card"><h2 class="card-title">提交信息</h2><div class="tip" id="templateTip"></div><div class="submit-field"><label class="field-label required" for="quantityInput" id="quantityLabel"></label><div class="quantity-row"><input id="quantityInput" type="number" min="0.01" step="0.01" placeholder="请输入"><span id="quantityUnit"></span></div></div><div id="fieldForm"></div></section>
  </main>
  <footer class="footer"><button class="btn" id="cancelBtnSecondary" onclick="document.getElementById('cancelBtn').click()">取消</button><button class="btn primary" id="submitBtn">确认提交</button></footer>
  <div class="toast" id="toast"></div>
  <script src="./result-submit-shared.js"></script>
</body>
</html>
