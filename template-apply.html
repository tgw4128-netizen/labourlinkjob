<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岗位成果模板应用 - 连续劳务平台</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #26364d;
      background: #f5f7fb;
      font-size: 14px;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 196px;
      background: #fff;
      border-right: 1px solid #e6ebf2;
      flex: 0 0 196px;
    }

    .brand {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid #eef2f7;
    }

    .brand-mark {
      color: #ff8a00;
      font-weight: 800;
      font-size: 24px;
    }

    .brand-name {
      font-weight: 700;
      color: #1b2b45;
    }

    .menu {
      padding: 14px 0;
    }

    .menu-title {
      padding: 12px 34px 8px;
      color: #1f2d3d;
      font-weight: 600;
      position: relative;
    }

    .menu-title::before {
      content: "";
      width: 8px;
      height: 8px;
      border: 2px solid #606b7a;
      border-radius: 50%;
      position: absolute;
      left: 9px;
      top: 17px;
    }

    .menu-title::after {
      content: "^";
      position: absolute;
      right: 22px;
      color: #8b96a8;
      font-size: 12px;
    }

    .menu-item {
      display: block;
      text-decoration: none;
      color: #3f4d5f;
      padding: 11px 34px;
      border-right: 3px solid transparent;
    }

    .menu-item.active {
      color: #1677ff;
      background: #eef6ff;
      border-right-color: #1677ff;
      font-weight: 600;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .topbar {
      height: 58px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e7ecf3;
    }

    .tabs {
      display: flex;
      height: 100%;
    }

    .tab {
      min-width: 140px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #eef2f7;
      background: #fafcff;
    }

    .tab.active {
      color: #1677ff;
      background: #fff;
      font-weight: 600;
      border-top: 2px solid #1677ff;
    }

    .tab-close {
      margin-left: 8px;
      color: #9aa6b5;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-right: 18px;
      color: #1677ff;
      font-size: 13px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #2d8cff;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .content {
      padding: 12px 20px 28px;
    }

    .panel {
      background: #fff;
      border: 1px solid #dfe6f0;
      margin-bottom: 14px;
    }

    .panel-header {
      min-height: 48px;
      padding: 13px 16px;
      border-bottom: 1px solid #e8edf4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-weight: 700;
      color: #1e2f46;
    }

    .panel-subtitle {
      color: #718096;
      font-size: 13px;
      margin-top: 4px;
    }

    .panel-body {
      padding: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 14px 20px;
    }

    .form-item {
      min-width: 0;
    }

    .form-item.wide {
      grid-column: span 2;
    }

    label {
      display: block;
      color: #5c6a7d;
      margin-bottom: 8px;
      font-size: 13px;
    }

    label.required::before,
    .required-star {
      content: "*";
      color: #f5222d;
      margin-right: 3px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      height: 34px;
      border: 1px solid #cfd8e6;
      border-radius: 4px;
      padding: 0 10px;
      color: #26364d;
      background: #fff;
      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      min-height: 72px;
      padding: 8px 10px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }

    .btn {
      height: 32px;
      padding: 0 16px;
      border: 1px solid #cfd8e6;
      border-radius: 4px;
      background: #fff;
      color: #26364d;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn.primary {
      background: #1677ff;
      color: #fff;
      border-color: #1677ff;
    }

    .btn.warning {
      color: #fa8c16;
      border-color: #ffd591;
      background: #fff7e6;
    }

    .field-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field-help {
      color: #718096;
      font-size: 13px;
    }

    .field-note {
      color: #a0a9b8;
      font-size: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #dfe6f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    th {
      background: #f4f7fb;
      color: #526176;
      font-weight: 600;
      height: 40px;
      border-bottom: 1px solid #dfe6f0;
      border-right: 1px solid #e6ebf2;
      text-align: left;
      padding: 0 10px;
      font-size: 13px;
    }

    td {
      height: 46px;
      border-bottom: 1px solid #edf1f6;
      border-right: 1px solid #edf1f6;
      padding: 6px 10px;
      vertical-align: middle;
    }

    .center {
      text-align: center;
    }

    .link {
      border: 0;
      background: transparent;
      color: #1677ff;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      background: rgba(29, 41, 57, 0.92);
      color: #fff;
      padding: 9px 16px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
    }

    @media (max-width: 1180px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">悠客</div>
        <div class="brand-name">智工快达</div>
      </div>

      <nav class="menu">
        <div class="menu-group">
          <div class="menu-title">用工管理</div>
          <a class="menu-item active" href="./template-apply.html">需求发布</a>
          <a class="menu-item" href="#">交付审核</a>
          <a class="menu-item" href="./template-config.html">成果模板配置</a>
          <a class="menu-item" href="#">招募与审核</a>
        </div>

        <div class="menu-group">
          <div class="menu-title">财务结算</div>
          <a class="menu-item" href="./index.html">人员结算</a>
          <a class="menu-item" href="./index.html">月度待结算</a>
        </div>

        <div class="menu-group">
          <div class="menu-title">人员管理</div>
          <a class="menu-item" href="#">人员管理</a>
          <a class="menu-item" href="#">个人协议</a>
        </div>

        <div class="menu-group">
          <div class="menu-title">服务商管理</div>
          <a class="menu-item" href="#">个人平台协议</a>
          <a class="menu-item" href="#">客户管理</a>
        </div>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="tabs">
          <div class="tab active">需求发布 <span class="tab-close">x</span></div>
          <div class="tab">成果模板配置</div>
        </div>
        <div class="top-actions">
          <span>连续劳务计算器</span>
          <span class="avatar">provider</span>
        </div>
      </header>

      <section class="content">
        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">岗位基础信息</div>
              <div class="panel-subtitle">创建岗位时先选择岗位分类，再选择可适用的成果模板。</div>
            </div>
            <button class="btn primary" id="saveJobBtn">保存岗位配置</button>
          </div>
          <div class="panel-body">
            <div class="form-grid">
              <div class="form-item">
                <label class="required">岗位名称</label>
                <input value="社区保洁服务">
              </div>
              <div class="form-item">
                <label class="required">岗位分类</label>
                <select id="jobCategorySelect">
                  <option value="生活服务-保洁服务">生活服务-保洁服务</option>
                  <option value="配送物流-同城跑腿">配送物流-同城跑腿</option>
                  <option value="推广营销-地推推广">推广营销-地推推广</option>
                  <option value="创意设计-设计任务">创意设计-设计任务</option>
                </select>
              </div>
              <div class="form-item">
                <label>服务城市</label>
                <input value="杭州">
              </div>
              <div class="form-item">
                <label>发布状态</label>
                <select>
                  <option>草稿</option>
                  <option>待发布</option>
                  <option>已发布</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <div class="panel-title">成果提交模板</div>
              <div class="panel-subtitle">选择后台已配置的模板后，系统自动带出字段，当前岗位可在模板基础上调整。</div>
            </div>
            <div style="display: flex; gap: 10px;">
              <a class="btn" href="./result-submit.html">查看 PC 提交页</a>
              <a class="btn" href="./result-submit-mini.html">查看小程序提交页</a>
              <button class="btn warning" id="resetTemplateBtn">恢复模板默认字段</button>
            </div>
          </div>
          <div class="panel-body">
            <div class="form-grid">
              <div class="form-item wide">
                <label class="required">选择成果模板</label>
                <select id="templateSelect"></select>
              </div>
              <div class="form-item wide">
                <label>个人端提示语</label>
                <textarea id="templateTip"></textarea>
              </div>
            </div>

            <div class="field-toolbar" style="margin-top: 16px;">
              <button class="btn primary" id="addFieldBtn">新增字段</button>
              <span class="field-help">字段名称、字段类型、是否必填、填写说明可按当前岗位单独调整；单选/多选需填写选项备注。</span>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width: 64px;">排序</th>
                    <th style="width: 170px;"><span class="required-star">*</span>字段名称</th>
                    <th style="width: 130px;"><span class="required-star">*</span>字段类型</th>
                    <th style="width: 100px;"><span class="required-star">*</span>必填</th>
                    <th style="width: 220px;">填写说明</th>
                    <th style="width: 220px;">备注</th>
                    <th style="width: 88px;">操作</th>
                  </tr>
                </thead>
                <tbody id="fieldBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const fieldTypes = ["单行文本", "多行文本", "图片上传", "文件上传", "视频上传", "日期时间", "单选", "多选"];
    const templates = [
      {
        id: "TPL202607001",
        name: "保洁服务成果模板",
        categories: ["生活服务-保洁服务", "生活服务-家政保洁"],
        version: "V3",
        creator: "平台运营",
        updateTime: "2026-07-08 14:20:16",
        tip: "请按要求上传清晰的工作成果材料，图片需能体现任务完成情况。",
        fields: [
          { name: "服务前照片", type: "图片上传", required: true, help: "需体现作业前现场状态" },
          { name: "服务后照片", type: "图片上传", required: true, help: "需体现作业完成效果" },
          { name: "服务地点", type: "单行文本", required: true, help: "填写实际服务地点" },
          { name: "完成说明", type: "多行文本", required: true, help: "简要描述完成内容" }
        ]
      },
      {
        id: "TPL202607002",
        name: "配送服务成果模板",
        categories: ["配送物流-配送服务", "配送物流-同城跑腿"],
        version: "V2",
        creator: "业务管理员",
        updateTime: "2026-07-07 09:45:33",
        tip: "请上传签收凭证并填写配送单号，异常情况需补充说明。",
        fields: [
          { name: "配送单号", type: "单行文本", required: true, help: "填写平台或客户提供的配送单号" },
          { name: "签收照片", type: "图片上传", required: true, help: "上传签收或交付凭证" },
          { name: "签收时间", type: "日期时间", required: true, help: "选择实际签收时间" },
          { name: "异常说明", type: "多行文本", required: false, help: "如有异常请说明" }
        ]
      },
      {
        id: "TPL202607003",
        name: "地推推广成果模板",
        categories: ["推广营销-地推推广", "推广营销-问卷调研"],
        version: "V1",
        creator: "平台运营",
        updateTime: "2026-07-06 18:02:11",
        tip: "请提交推广现场材料和有效推广数据，客户名单可按需上传。",
        fields: [
          { name: "推广地点", type: "单行文本", required: true, help: "填写实际推广地点" },
          { name: "现场照片", type: "图片上传", required: true, help: "上传活动现场照片" },
          { name: "推广人数", type: "单行文本", required: true, help: "填写有效推广人数" },
          { name: "客户名单", type: "文件上传", required: false, help: "上传有效客户名单" },
          { name: "工作总结", type: "多行文本", required: true, help: "填写推广总结" }
        ]
      }
    ];

    let currentTemplate = templates[0];
    let jobFields = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function cloneTemplateFields(template) {
      return template.fields.map(field => ({ ...field }));
    }

    function hasOptionConfig(type) {
      return type === "单选" || type === "多选";
    }

    function readFieldRows() {
      jobFields = Array.from(document.querySelectorAll("#fieldBody tr")).map(row => ({
        name: row.querySelector('[data-field="name"]').value.trim(),
        type: row.querySelector('[data-field="type"]').value,
        required: row.querySelector('[data-field="required"]').value === "true",
        help: row.querySelector('[data-field="help"]').value.trim(),
        options: hasOptionConfig(row.querySelector('[data-field="type"]').value)
          ? row.querySelector('[data-field="options"]').value.trim()
          : ""
      }));
    }

    function renderTemplateOptions() {
      document.getElementById("templateSelect").innerHTML = templates.map(template => `
        <option value="${template.id}">${template.name}</option>
      `).join("");
    }

    function renderSummary() {
      document.getElementById("templateTip").value = currentTemplate.tip;
    }

    function renderFieldRows() {
      document.getElementById("fieldBody").innerHTML = jobFields.map((field, index) => `
        <tr>
          <td class="center">${index + 1}</td>
          <td><input data-field="name" value="${escapeHtml(field.name)}" placeholder="如：服务后照片"></td>
          <td>
            <select data-field="type">
              ${fieldTypes.map(type => `<option value="${escapeHtml(type)}" ${field.type === type ? "selected" : ""}>${escapeHtml(type)}</option>`).join("")}
            </select>
          </td>
          <td>
            <select data-field="required">
              <option value="true" ${field.required ? "selected" : ""}>是</option>
              <option value="false" ${!field.required ? "selected" : ""}>否</option>
            </select>
          </td>
          <td><input data-field="help" value="${escapeHtml(field.help)}" placeholder="给个人看的填写说明"></td>
          <td>
            ${hasOptionConfig(field.type)
              ? `<input data-field="options" value="${escapeHtml(field.options || "")}" placeholder="填写选项，多个选项用 # 分隔">`
              : `<span class="field-note">非单选/多选无需配置</span><input data-field="options" type="hidden" value="">`
            }
          </td>
          <td><button class="link" data-action="delete-field" data-index="${index}">删除</button></td>
        </tr>
      `).join("");
    }

    function applyTemplate(templateId, keepToast = true) {
      currentTemplate = templates.find(template => template.id === templateId) || templates[0];
      jobFields = cloneTemplateFields(currentTemplate);
      renderSummary();
      renderFieldRows();
      if (keepToast) showToast("已带出模板配置项，可按当前岗位调整");
    }

    document.getElementById("templateSelect").addEventListener("change", event => {
      applyTemplate(event.target.value);
    });

    document.getElementById("fieldBody").addEventListener("click", event => {
      const button = event.target.closest('button[data-action="delete-field"]');
      if (!button) return;
      readFieldRows();
      jobFields.splice(Number(button.dataset.index), 1);
      renderFieldRows();
      showToast("字段已删除");
    });

    document.getElementById("fieldBody").addEventListener("change", event => {
      if (!event.target.closest('select[data-field="type"]')) return;
      readFieldRows();
      renderFieldRows();
    });

    document.getElementById("addFieldBtn").addEventListener("click", () => {
      readFieldRows();
      jobFields.push({ name: "", type: "单行文本", required: false, help: "" });
      renderFieldRows();
      showToast("已新增字段");
    });

    document.getElementById("resetTemplateBtn").addEventListener("click", () => {
      applyTemplate(currentTemplate.id);
    });

    document.getElementById("saveJobBtn").addEventListener("click", () => {
      readFieldRows();
      showToast("已保存岗位成果提交配置");
    });

    renderTemplateOptions();
    applyTemplate(currentTemplate.id, false);
  </script>
</body>
</html>
